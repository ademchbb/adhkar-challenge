# Configuration Netlify — Adhkar Challenge
# Le site est servi tel quel (pas de build) ; les dépendances npm des
# fonctions sont installées automatiquement grâce à package.json.

[build]
  publish = "."

# La clé d'API Firebase côté web (AIza...) est PUBLIQUE par conception : elle
# identifie le projet, la sécurité vient des règles Firestore. Le détecteur
# heuristique de Netlify la prend pour une fuite, on le désactive.
# La vraie protection reste active : Netlify continue de vérifier que les
# VALEURS de VAPID_PRIVATE et FIREBASE_SERVICE_ACCOUNT n'apparaissent nulle
# part dans le site publié.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Le service worker ne doit jamais être servi depuis le cache du CDN,
# sinon les mises à jour de l'app mettent des heures à arriver.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
